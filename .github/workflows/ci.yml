# Every pull request into main and every push to main (trunk branching), on Linux and
# Windows (FR-019, research R10).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per pull request (superseded runs are cancelled); one per commit otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,cargo-deny

      - name: Format
        run: cargo fmt --all --check

      # The desktop crate embeds the interface when built with all features.
      - name: Build the interface
        working-directory: crates/aurora-ui
        run: trunk build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (interface, WebAssembly)
        run: cargo clippy -p aurora-ui --target wasm32-unknown-unknown -- -D warnings

      - name: Architecture dependency rule
        run: cargo xtask arch-check

      - name: Licenses, advisories and sources
        run: cargo deny check

  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1

      - name: Build the interface
        working-directory: crates/aurora-ui
        run: trunk build --release

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Desktop build
        run: cargo build -p aurora-desktop --release --features custom-protocol

      - name: Binary size
        shell: bash
        run: |
          binary=target/release/aurora
          [ -f "$binary.exe" ] && binary="$binary.exe"
          bytes=$(wc -c < "$binary")
          echo "Aurora binary on ${{ runner.os }}: $((bytes / 1024)) KiB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
