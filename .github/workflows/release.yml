# Release: builds Aurora's packages and publishes them for a version tag (ADR-0008).
# - vX.Y.Z-rc.N tags (release candidates, pushed on main) publish a PRE-RELEASE, never latest.
# - vX.Y.Z final tags are created by the promote workflow, which calls this workflow directly
#   (a tag pushed with GITHUB_TOKEN would not trigger it).
# - On a pull request that changes the packaging, or run by hand (Actions > Release > Run
#   workflow) on any branch, it is a dry run: the packages are kept as the run's artifacts and
#   nothing is published.
# The tag must match the workspace version (`cargo xtask release-check`). Releases go to the
# repository in the RELEASES_REPOSITORY variable with the RELEASES_TOKEN secret when it is set
# (the public releases repository of ADR-0005), to this repository otherwise.
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - crates/aurora-desktop/tauri.conf.json
      - crates/aurora-desktop/icons/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TAURI_CLI: tauri-cli@2.12.4

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG:+refs/tags/$TAG}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "Dry run on $REF_NAME: packages are kept as artifacts, nothing is published" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref || github.ref }}

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - name: The tag matches the workspace version
        if: steps.tag.outputs.tag != ''
        run: cargo xtask release-check "${{ steps.tag.outputs.tag }}"

  package:
    name: Test and package (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu (TECH_SPEC): the binary links against its glibc, so
          # the packages also run on Ubuntu 22.04 (a binary built on 24.04 needs glibc 2.39).
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref || github.ref }}

      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,${{ env.TAURI_CLI }}

      - name: Build the interface
        working-directory: crates/aurora-ui
        run: trunk build --release

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Build the packages
        working-directory: crates/aurora-desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }} --ci

      - name: The Linux binary runs on Ubuntu 22.04 (glibc 2.35)
        if: runner.os == 'Linux'
        run: |
          needed=$(objdump -T target/release/aurora | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Highest glibc symbol version: $needed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n' "$needed" 2.35 | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::the binary needs glibc $needed; Ubuntu 22.04 has 2.35"; exit 1
          fi

      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p dist
          bundle=target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bundle"/nsis/*-setup.exe dist/
            installed=$(wc -c < target/release/aurora.exe)
            echo "Installed size (aurora.exe): $((installed / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          else
            cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage dist/
            for deb in dist/*.deb; do
              echo "Installed size ($(basename "$deb")): $(dpkg-deb -f "$deb" Installed-Size) KiB" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          for file in dist/*; do
            echo "Package $(basename "$file"): $(( $(wc -c < "$file") / 1024 )) KiB" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check, package]
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          TAG: ${{ needs.check.outputs.tag }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASES_REPOSITORY" ]; then
            if [ -z "$RELEASES_TOKEN" ]; then
              echo "::error::RELEASES_REPOSITORY is set but the RELEASES_TOKEN secret is missing"; exit 1
            fi
            repo="$RELEASES_REPOSITORY"
            export GH_TOKEN="$RELEASES_TOKEN"
          else
            repo="$GITHUB_REPOSITORY"
            export GH_TOKEN="$WORKFLOW_TOKEN"
          fi
          flags=()
          case "$TAG" in
            *-rc.*) flags=(--prerelease --latest=false) ;;
          esac
          gh release create "$TAG" dist/* --repo "$repo" --title "Aurora $TAG" --generate-notes "${flags[@]}"
          echo "Published $TAG to $repo" | tee -a "$GITHUB_STEP_SUMMARY"
