# cargo-deny: licenses, RustSec advisories and banned crates (ADR-0005).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in Leptos (paste) and GTK on Linux (proc-macro-error) with no
# safe upgrade; they are build-time macros, not vulnerabilities. Revisit on each upgrade.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: macro used by Leptos, no maintained replacement upstream yet" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: used by glib-macros of the GTK stack on Linux" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# Named exceptions approved for v0.1.0 (TECH_SPEC, ADR-0005): MPL-2.0 is copyleft per
# file only, and these crates are used unmodified. Any other crate needs a new review.
exceptions = [
    { name = "cssparser", allow = ["MPL-2.0"] },
    { name = "cssparser-macros", allow = ["MPL-2.0"] },
    { name = "selectors", allow = ["MPL-2.0"] },
    { name = "dtoa-short", allow = ["MPL-2.0"] },
    { name = "option-ext", allow = ["MPL-2.0"] },
    { name = "base16", allow = ["CC0-1.0"] },
    { name = "xxhash-rust", allow = ["BSL-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
